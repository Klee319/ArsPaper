  # 2026-08-18: "6" 段は【重複セットを既定で許可したことで到達可能になった】。
  # 経緯: 旧既定(threads.yml の stackable 未記載 = 重複不可)だと1装備あたり1個 ×
  # キャリア5個(防具4部位+メインハンド。オフハンドは offhand-stats-apply: true の品が
  # 出荷 item-stats.yml に0件なので数えない)で上限5本、6段は永久に発動しなかった。
  # 一度は6段ぶんの値を5段へ畳んだが、ユーザー確定要件「同一のスレッドを重複で入れられる
  # ようにしてほしい」により既定を重複可(1装備あたり max 既定2本)へ反転したので、
  # 上限は 2 × 5 = 10本。設計書 §3-A-5 どおりの6段構成へ戻してある。
  role_luck:
    thresholds:
      "2":
        craft-roll-up-bonus: 2
      "3":
        craft-roll-up-bonus: 2
      "4":
        craft-roll-up-bonus: 2
      "5":
        craft-roll-up-bonus: 2
      "6":
        craft-roll-up-bonus: 2
  role_effeciency:
