      "4":
        craft-roll-down-reduction: 5
      "5":
        craft-roll-down-reduction: 5
      "6":
        craft-roll-down-reduction: 10
  # 盲目のスレッド: 最大体力を削る代わりに攻撃力を大きく伸ばすピーキー品。
  # 2026-08-21: attack-power を固定値(+100/+150)から【乗算モード】へ移した。
  #   固定値だと Lv20 帯の最強武器(攻撃力 700 前後)をスレッド1本が上書きしてしまい、
  #   低帯だけ極端に強くなる(TF ShippedThreadBandIndependenceTest が固定している
  #   「スレッド1本ぶんのダメージ倍率は帯に依らず一定」を壊す)。
  #   乗算なら 1個で +25% / 5個でさらに +40% = 合計 +65% が全帯で同じ意味になる。
  blindness:
    thresholds:
      "1":
        max-health: -4
        attack-power: { mode: multiply, value: 0.25 }
      "5":
        max-health: -6
        damage-modifier: 0.3
        attack-power: { mode: multiply, value: 0.40 }
  translate:
    thresholds:
      "2":
        mana-bonus: -40
        mana-regen: 5
      "5":
        mana-bonus: -60
        mana-regen: 5

