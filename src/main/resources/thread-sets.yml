  # 【"6" 段は再び畳んだ ── 2026-08-25 (W-254)】
  # 到達可能な本数は「1装備あたりの上限 × キャリア5個」で決まる
  # (キャリア = 防具4部位 + メインハンド。オフハンドは offhand-stats-apply: true の品が
  #  出荷 item-stats.yml に0件なので数えない)。
  #   2026-08-18 まで: 上限1 → 5本  … 6段は永久に死んでいた(一度5段へ畳んだ)
  #   2026-08-18〜  : 上限2 → 10本 … 6段を復活させた
  #   2026-08-25〜  : 上限1 → 5本  … ユーザー確定要件「同じスレッドは同じ部位に1つまで」で
  #                                  また到達不能になったので、6段ぶんの値を5段へ足し込んだ
  # ⚠ <b>値を捨てたのではなく5段へ加算してある</b>(累積式なので上限に届いた人の総量は変わらない)。
  #   role_luck:        5段 2 + 6段 2  = 4
  #   role_effeciency:  5段 5 + 6段 10 = 15
  #   6段を書き足すときは先に ThreadApplicationPolicy.DEFAULT_MAX_STACK を確認すること。
  role_luck:
    thresholds:
      "3":
        craft-roll-up-bonus: 3
      "5":
        craft-roll-up-bonus: 7
  role_effeciency:
    thresholds:
      "3":
        craft-roll-down-reduction: 3
      "5":
        craft-roll-down-reduction: 7
  # 盲目のスレッド: 最大体力を削る代わりに攻撃力を大きく伸ばすピーキー品。
  # 2026-08-21: attack-power を固定値(+100/+150)から【乗算モード】へ移した。
  #   固定値だと Lv20 帯の最強武器(攻撃力 700 前後)をスレッド1本が上書きしてしまい、
  #   低帯だけ極端に強くなる(TF ShippedThreadBandIndependenceTest が固定している
  #   「スレッド1本ぶんのダメージ倍率は帯に依らず一定」を壊す)。
  #   乗算なら 1個で +25% / 5個でさらに +40% = 合計 +65% が全帯で同じ意味になる。
  # 2026-08-22(W-186): layer: layer_1 を明示した。無指定だと「addon」という専用レイヤに入り、
  #   装備側の攻撃力%(layer_1)とは【掛け算】になって二重に乗る。layer_1 を名指しすると
  #   装備の攻撃力%と同じレイヤの中で足し算になる(TF の合成規則: レイヤ内は Σ(v-1)、レイヤ同士は積)。
  blindness:
    thresholds:
      "1":
        max-health: -6
        attack-power: { mode: multiply, value: 0.25, layer: layer_1 }
      "5":
        max-health: -10
        damage-modifier: 0.3
        attack-power: { mode: multiply, value: 0.40, layer: layer_1 }
  translate:
    thresholds:
      "2":
        mana-bonus: -40
        mana-regen: 5
      "5":
        mana-bonus: -60
        mana-regen: 5

  # ---- 2026-08-21 戦闘系スレッド24種のセット効果 ------------------------------
  #  攻撃力は【乗算モード】で配る。固定値だと帯(進行度)で桁が変わる攻撃力に対して
  #  低帯だけ極端に強くなり、TF ShippedThreadBandIndependenceTest が固定している
  #  「スレッド1本ぶんのダメージ倍率は帯に依らず一定」を壊すため。
  #  percent-bonus-damage はセット効果側では【1件も配らない】——
  #  帯予算(防具枠16本で +59%)は item-stats 側の1本あたりの値だけで管理する。
  #  2026-08-22(W-186): 乗算には layer: を必ず書く。攻撃力% は layer_1(TF stats/lore.yml の
  #  multiplier-layers)。書き忘れると装備側の同種倍率と別レイヤ扱いになり掛け算で二重に乗る。
  swordsman:
    thresholds:
