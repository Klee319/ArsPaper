# ArsPaper - スレッド・セット効果 (thread-sets.yml)
# 装備にソケットした「スレッド」の【同種の合計装備個数】に応じた累積セット効果ボーナスを定義します。
# 戦闘ステはTrinityForgeのパイプラインへ合流します
# (着用防具4部位 + メインハンド + オフハンド(offhand-stats-apply: true の品)のスレを集計→攻撃/防御に反映)。
# ※ 常時ポーション効果・飛行・バックパックは着用防具のみ。セット効果と厳選ステは手持ちでも効きます。
#
# ■ このファイルが定義するもの = セット効果(個数ボーナス)
#   各スレッドは固有のトリム材/陶器の欠片(baseMaterial) + CustomModelData(300002〜300040) を持ちます。例:
#     mana_regen      -> TIDE_ARMOR_TRIM_SMITHING_TEMPLATE#300002
#     mana_boost      -> WARD_ARMOR_TRIM_SMITHING_TEMPLATE#300003
#     damage_mana_recovery -> WILD_ARMOR_TRIM_SMITHING_TEMPLATE#300013
#   (全40種の material#cmd は ThreadType enum 参照)
#
# ■ スレッド単体のステは【TrinityForge の stats/item-stats.yml】へ書く (2026-08-14 更新)
#   ⚠ 2026-08-02〜2026-08-13 のこの位置には「item-stats.yml へ書いてはいけない/行が0件なのは意図的」
#     という警告が載っていたが、【もう正しくない】。現在の出荷 item-stats.yml にはスレッド45種
#     (CMD 300001-300045)のエントリが実在し、厳選(per-quality / random / grant-chances)もそこにある。
#
#   ・当時あった穴: ArmorManaListener はソケット済みスレッドの item-stats.yml を読むが、
#     【同じエントリ】を TrinityForge の PlayerStatAggregator#aggregate が材質フィルタ無しで
#     メインハンド/オフハンド/防具スロットの寄与としても読んでいた。
#     つまり「装備に挿さず、スレッドを手に持つだけで全ステが乗る」。
#   ・穴を塞いだもの: item-stats.yml のエントリ側フラグ【socketed-only-stats: true】。
#     これが立っているエントリは PlayerStatAggregator が装備寄与として合算しない。
#     装着済みスレッドの寄与は ArmorManaListener -> WeaponAttackStatResolver#resolveItemStats
#     という別経路なので、このフラグでは止まらない(=挿せば今までどおり効く)。ロア表示も止まらない。
#
#   ・今後スレッドのステをどこに書くか:
#       スレッド1個ごとの厳選ステ  -> TrinityForge stats/item-stats.yml の MATERIAL#CMD エントリ。
#                                   【必ず socketed-only-stats: true を付ける】。付け忘れると穴が再発する。
#       同種を複数集めたご褒美      -> このファイル(thresholds)。個数集計はソケット済みしか数えないので
#                                   手持ちでは絶対に発動しない。1個から効かせたいなら 1段目を "1" にする。
#
#   ⚠ 帯バランス上の注意(2026-08-14): thresholds に percent-bonus-damage を足すと、
#     TF 側 ShippedThreadBandIndependenceTest の帯目標(+39%/+49%/+59%)に直接効く。
#     このガードは threads.yml の stackable/max とこのファイルの累積規則を読んで
#     「最良編成の合計」を解いているので、ここを触ったら必ず TF のテストを回すこと。
#     【現在の規約】percent-bonus-damage を配るセットは hero_of_the_village の1本だけ。
#     案Eで3本(村の英雄/マナ回復速度上昇/暗視)に増やしたところ、累積しきい値と stackable の
#     相乗で Lv60/Lv100 が +13.0pt 超過した。2本目を足すと同じことが起きるので、
#     ダメージ系のセット効果を増やしたいときは既存分を減らして総量を保つこと。
#
# ■ セット効果の加算モデル = 累積しきい値式
#   同種スレッドの合計装備個数 N に対し、N 以上の全しきい値のボーナスを【合算】します。
#   例: 3個で {A}、5個で {B} を定義 → 5個装着時は A + B の両方が乗る(3個分にも到達しているため)。
#
# ■ 利用可能なステキー(item-stats.yml と同一。canonical化されるので大小/区切りは無視)
#   攻撃系: attack-power, flat-bonus-damage, percent-bonus-damage, crit-chance, crit-damage,
#           penetration, damage-modifier, fixed-damage, bleed-chance, bleed-damage
#   防御系: phys-resistance, magic-resistance, flat-defense, damage-reduction, dodge-chance,
#           armor-defense-rate, armor-strength
#   ※ 割合系(crit-chance / penetration / 各resistance / damage-reduction / dodge-chance / armor-defense-rate)は
#     0.0〜1.0 の割合値。
#
#   ⚠ armor-defense-rate(防御率%)の注意: この値はバニラ防具の防御率(上限0.8)へ【加算的に】積み上がります。
#     合計が1.0に達すると、貫通0の相手からの物理を実質無効化します(clampで1.0上限)。
#     セット効果で armor-defense-rate を盛る場合は、バニラ防具分(最大0.8)と合わせて過剰にならない値に留めてください。
#     (恒常的な物理無効を避けたい場合は damage-reduction や flat-defense を使う方が安全です)
#
# ■ 記入例(累積しきい値):
#   thread-sets:
#     mana_regen:
#       thresholds:
#         3: { magic-resistance: 0.05, flat-defense: 1.0 }   # 3個以上で発動
#         5: { magic-resistance: 0.10 }                       # 5個以上で更に加算(=合計0.15)
#   (例に percent-bonus-damage を使っていない理由は上の【現在の規約】を参照)
#
# 下は全スレッド種の雛形(thresholds 空 = セット効果なし)。必要なものにしきい値を書き足してください。

# 設定リファレンス(本文コメント移設先): docs/config-reference/arspaper/thread-sets.md

thread-sets:
  mana_regen:
    thresholds: {}
  mana_boost:
    thresholds: {}
  speed:
    # 迅速: 速く動く → 速く壊す
    thresholds:
      "3":
        break-vanilla-exp-bonus: 0.024
      "5":
        break-vanilla-exp-bonus: 0.036
  jump_boost:
    # 跳躍: 動き回る → 食料の持ち
    thresholds:
      "3":
        food-save-chance: 0.024
      "5":
        food-save-chance: 0.036
  night_vision:
    # 暗視: 暗所 → 発掘品の磨き
    thresholds:
      "3":
        suspicious-respawn-chance: 0.03
      "5":
        suspicious-respawn-chance: 0.045
  fire_resistance:
    # 耐火: 火を扱う → 醸造の品質
    thresholds:
      "3":
        potion-quality-bonus: 0.5
      "5":
        potion-quality-bonus: 0.5
  dolphins_grace:
    # イルカの好意: 海 → 釣果の売値
    thresholds:
      "3":
        fish-sell-price-bonus: 0.03
      "5":
        fish-sell-price-bonus: 0.045
  conduit_power:
    # コンジットパワー: 水中 → 二本釣り
    thresholds:
      "3":
        fishing-bonus: 0.024
      "5":
        fishing-bonus: 0.036
  hero_of_the_village:
    # 村の英雄: 襲撃を退ける → 討伐EXP
    thresholds:
      "3":
        kill-vanilla-exp-bonus: 0.03
      "5":
        kill-vanilla-exp-bonus: 0.045
  health_boost:
    # 体力増強: 体力 → 隠し満腹度
    thresholds:
      "3":
        hidden-saturation-bonus: 0.09
      "5":
