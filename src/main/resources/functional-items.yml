# ============================================================
# functional-items.yml - 機能アイテム設定 (2026-07-25 統合)
# ============================================================
# 対象7アイテム: dominion_wand / teleport_compass / pedestal / ritual_core /
#                scribing_table / waystone / source_berry
# (ワンド/コンパス/儀式ブロック等、プログラム制御の機能アイテム)
#
# 2026-08-14 追加: エンチャント本8件 (enchant_book_*)。
#   items.yml の items: セクションに置いていたが、設定エディタの「儀式エフェクト」画面が
#   ritual_effects: しか表示しない実装だったため、editor から一切見えず編集もできなかった
#   (=「儀式レシピが消えている」の正体。yml とゲーム内には最初から在った)。
#   本ファイルは FunctionalItemConfig が items: の全キーを総なめで読むので、ここへ移せば
#   display-name / lore / enchant-glow の上書きがそのまま効く。レシピの登録キーは
#   エントリID そのままなので、移動しても儀式の成立条件も解放ゲートのキーも変わらない。
#
# 編集可能なキー:
#   display-name : 表示名 (MiniMessage記法)
#   lore          : 説明文リスト (MiniMessage記法)
#   enchant-glow  : エンチャント光の表示有無 (true/false)
#   material      : 素材 (※ dominion_wand / teleport_compass / source_berry の
#                   「保持アイテム」3種のみ有効。pedestal/ritual_core/scribing_table/waystone
#                   の「ブロック」4種はTileState対応判定・儀式の近傍探索等、Materialに
#                   密結合したコードが複数あるため未対応。書いても無視され警告ログが出る)
#   recipe        : クラフトレシピ。method: workbench(作業台/2×2インベントリ) または
#                   method: ritual(儀式) に対応。記法は下記参照。
#
# 編集不可 (プログラム側固定。書いても無視され、警告ログが1回出る):
#   内部ID (このセクションのキー名そのもの) / custom-model-data
#
# 全キーは省略可能。省略時はfork Java実装のハードコード値にフォールバックする
# (=display-nameだけ書かれた旧来のエントリはそのまま動く)。
#
# レシピ記法 (catalog.yml / items.yml と同じ):
#   method: workbench  - 作業台クラフト (type: shaped/shapeless, shape, ingredients, amount)
#     - type: inventory とすると2×2インベントリクラフトにも対応 (shape最大2×2)
#   method: ritual      - 儀式クラフト (core-item, pedestal-items, source)
#     - 結果アイテムは常にこのエントリ自身 (custom:<エントリのキー名>)。result明示指定は不要。
#
# custom: プレフィックスは本プラグインのカスタムアイテムを参照する。
# "x2" 等の記法はアイテム数量を示す。
#
# 移行元 (2026-07-25): dominion_wand/teleport_compass/source_berryは
# TrinityForge items/catalog.yml から、pedestal/ritual_core/scribing_table/waystoneは
# 本プラグインの items.yml から、それぞれレシピ含め本ファイルへ統合した。
# catalog.yml / items.yml 側は当該エントリを削除済み(カタログにレシピを二重登録する必要はない)。
# ============================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/arspaper/functional-items.md

items:
