# ============================================================
# ArsPaper Unlock Gate (解放ゲート / UNLOCK Model)
# ============================================================
# TrinityForge 統合アドオンの perk 所持状況で、
# クラフトレシピ・儀式レシピの解放を制御する。
#
# perk の所持判定は PlayerData.heldPerks() のエントリと一致するかで行う。
# perk ID は TF の PerkNaming 形式 <compact>_perk_<node>（例 arssmithing_perk_d_1）。
# 未定義のレシピ/儀式はゲート無し（解放=従来通り使用可）。
# TrinityForge 未ロード時は安全側（ゲート無効=使用可）に倒す。
#
# ■ Source of truth (SoT)
# レシピ/儀式 → perk 対応の正本は TrinityForge の各スキルツリー yml
#   (skilltree/*.yml) のノード内 dedicated-effects: フィールド（id: "recipe:<id>" / "ritual:<id>" =
#   channel recipe-gate / ritual-gate）である。読み込みは SkillTreeConfig#parseDedicatedEffects が行う。
# 本ファイルの recipe-perks / ritual-perks は空を維持し、ランタイムでは
# TrinityForgeBridge.tfRecipeGatePerks() / tfRitualGatePerks()（skilltree 由来）と
# union(OR) 判定する。サーバー運用で fork 側だけ一時的に上書きしたい場合のみ追記する。
#
# ▼ 2026-07-28 更新: 上の「未 gate（対象未実装のため）」リストは実態と合っていなかったので訂正した。
#   - 各種コア（tf_core_wood / vegetable / meat / jewelry）と上位ソースジャー(source_gem_block)、
#     圧縮食料(compressed_*)は materials.yml に method: workbench の実体があり、TF skilltree 側に
#     recipe: ゲートが置かれていて**現に機能している**（未 gate ではない）。
#   - バニラ防具・道具クラフト（石/鉄/ダイヤ/ネザライト, SMITHING A〜D）のゲートは撤去された。
#     道具・防具側に既に使用可能レベルがあり二重ティアゲートが無意味だったため
#     （理由は TrinityForge skilltree/smithing.yml のヘッダコメント参照）。
#   - 儀式アイテム（enchant_book_* / volcanic_sourcelink）は TF skilltree で誤って recipe: 側に
#     置かれていた。ArsPaper は儀式を ritualPerks / tfRitualGatePerks でしか照合しない
#     （UnlockGate#hasRitualPermission）ので無言で常時解放だった → ritual: へ修正済み。
#   ▼ 依然として未 gate（ArsPaper 側に実体が無い or TF 側機構）:
#   - ソースジェム武器コーティング
#   - 村人職（司祭/鍛冶師/司書取引）, 解体(SMITHING B-3-upper), スレッド欄拡張(ARS_SMITHING E)
# ============================================================

# レシピID → 必要 perk ID。
# レシピID は登録時の NamespacedKey のキー部分（items.yml の id、
# 防具レシピは "armor_<itemId>"）。未定義 = ゲート無し。
# 空マップ = yml 側ゲート無し（TF skilltree 側の定義は引き続き有効）。
# 設定リファレンス(本文コメント移設先): docs/config-reference/arspaper/unlock-gate.md
recipe-perks: {}

ritual-perks: {}

repair-ritual:
  enabled: true
  extra-source-cost: 0
