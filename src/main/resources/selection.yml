# ============================================================
# selection.yml - 厳選(ItemQuality + rollSeed)設定
#
# ArsPaper のカスタムアイテムは生成時に rollSeed(long) と品質(0-5) を
# TrinityForge の ItemData(PDC) へ書き込む。実際のステ値はベイクせず、
# TrinityForge 側のテーブルが rollSeed + 品質から live 導出する。
# このファイルでは「どの品質を引くか」の抽選分布のみを管理する。
# ============================================================

# 品質(0-5)抽選分布。各品質に整数ウェイトを割り当て、合計で正規化される。
# 空（全コメントアウト）の場合は抽選を行わず、生成経路の既定品質(通常0)が使われる。
# 品質範囲は TrinityForge ItemData 仕様に一致（MIN_QUALITY=0 / MAX_QUALITY=5）。
# 以下は低品質寄りだが上位も出る暫定分布。要バランス調整（合計100で正規化される）。
quality-distribution:
  0: 50   # 並（暫定）
  1: 25   # 良（暫定）
  2: 15   # 優（暫定）
  3: 7    # 秀（暫定）
  4: 2    # 極（暫定）
  5: 1    # 神（暫定）

# rollSeed から導出するステの振れ幅(品質ごとのロール範囲)は
# TrinityForge 側のテーブルが担当する。ここでは管理しない。
