# ============================================================
# ArsPaper Configuration
# ============================================================
# プラグインの基本設定ファイル。
# スレッドの設定は threads.yml で管理する。
# グリフの設定は glyphs.yml で管理する。
# ============================================================

# ============================================================
# form別クールダウン (MAGIC_BALANCE)
# ============================================================
# 形態(form)ごとに独立したクールダウン秒数を設定する。
# プレイヤー × form 単位で独立してCTが管理される。
# - 0 または未定義 = 従来のクールダウン（連射増強で短縮される計算CT）にフォールバック。
# - キーは form の NamespacedKey のキー部分（例: projectile, beam, touch, self,
#   underfoot, overhead, burst, orbit）。
form-cooldowns:
  projectile: 0
  self: 0

mana:
  # 初期マナ上限（装備/スレッド/エンチャント/グリフ解放で増加）
  default-max: 100
  # 初期常時マナ回復量（装備/スレッド/エンチャントで増加）
  default-regen-rate: 5
  # 回復間隔（tick単位, 20tick = 1秒）
  regen-interval-ticks: 20
  # グリフ1つ解放ごとのマナ上限ボーナス
  per-glyph-unlock-bonus: 5
  # マナ最大値%上昇の上限（%）。装備由来の%上昇（threads.yml: mana-max-percent）をここでクランプ
  max-percent-cap: 100
  # 戦闘/非発動時のマナ回復（本サーバ仕様, COMBAT §3.4）。
  # 以下は控えめな暫定デフォルト（要バランス調整）。%は最大マナに対する割合。
  recovery:
    # 被弾時: 最大マナに対する%回復（暫定: 3% = 最大100で3マナ）
    on-hit-percent: 3
    # 被弾時: 固定値回復
    on-hit-flat: 0
    # 攻撃時: 最大マナに対する%回復（暫定: 3%。※近接攻撃のみ、スペル命中は対象外）
    on-attack-percent: 3
    # 攻撃時: 固定値回復
    on-attack-flat: 0
    # 最後の詠唱からこの秒数以上経過で「非発動」とみなす
    idle-seconds: 5
    # 非発動時の回復ボーナス: 1回復tickごとに最大マナに対する%を加算（暫定: 1%）
    idle-bonus-percent: 1
    # 非発動時の回復ボーナス: 1回復tickごとに固定値を加算
    idle-bonus-flat: 0

# ARS_MAGIC(魔法柱スキル)へのEXP付与(TrinityForge連携)。呪文詠唱成功ごとに付与。
# 「使い込み」でレベルが上がり combat level の魔法柱になる。数値は暫定・要バランス調整。
ars-magic:
  exp-per-cast: 2.0     # 詠唱1回あたりの基礎EXP
  exp-per-mana: 0.1     # 消費マナ1あたりの追加EXP

# Geyser (統合版) 互換設定
geyser:
  # trueにするとCustomModelDataを設定しない（統合版でアイテムが透明になる問題を回避）
  # リソースパック未使用のGeyserサーバーではtrueにすること
  disable-custom-model-data: true

# カスタムエンチャント定数
# 金床でメイジ防具に適用した際のボーナス値
enchantments:
  mana-regen-per-level: [0, 1, 3, 6]    # Lv0(未使用), Lv1, Lv2, Lv3
  mana-boost-per-level: [0, 15, 30, 50]  # Lv0(未使用), Lv1, Lv2, Lv3
  max-level: 3

# モブドロップ設定
mob-drops:
  # ウォーデン討伐時に残響の欠片をドロップするか
  warden-echo-shard: false
  # ドロップ数（min-max）
  # ドロップ数（min-max、ドロップ増加エンチャントで追加加算）
  warden-echo-shard-min: 0
  warden-echo-shard-max: 2

# ルートチェスト設定
loot:
  enabled: true
  # カスタムエンチャント本がチェストに出現する確率(0.0-1.0)
  enchant-book-chance: 0.05
  # エンチャント金リンゴがチェストに出現する確率(0.0-1.0)
  enchanted-golden-apple-chance: 0.01
