# ============================================================
# ArsPaper Configuration
# ============================================================
# プラグインの基本設定ファイル。
# スレッドの設定は threads.yml、グリフの設定は glyphs.yml、
# ソースリンク/ジャーは sourcelinks.yml / sourcejars.yml で管理する。
#
# 【2026-07-30 復旧】このファイルは 17c9f65「TrinityForge 連携の未コミット分を
# まとめて保存」で誤って sourcelinks.yml の内容(volcanic:/mycelial:/alchemical:/items:)へ
# 上書きされていた。ヘッダのコメントだけが残っていたのは
# 「先頭の連続する # ブロックだけを復元する」editor の保存仕様によるもの。
# getter が既定値を持つためエラーもログも出ず、稼働サーバでも
# form-cooldowns / mana / enchantments / mob-drops / loot が
# 全て「既定値のまま」で動いていた。
#
# 復旧時に 6b9e66a 版へ単純に戻すことはしていない —— マナ基礎値
# (default-max / default-regen-rate / regen-interval-ticks / recovery.*) と
# ars-magic の EXP、geyser の CMD 設定は TrinityForge 側へ移管済みで、
# ここに書いても効かない「死にキー」になるため意図的に除外した。
#   マナ基礎値の真源 = TrinityForge combat/base-stats.yml の
#     mana-max-base / mana-regen-base / mana-regen-interval-ticks /
#     mana-onhit-percent / mana-onattack-percent / mana-idle-* (ManaBaseStats 経由)
#   ARS_MAGIC の EXP  = TrinityForge stats/skill-exp.yml
#
# 設定リファレンス(本文コメント移設先): docs/config-reference/arspaper/config.md
# ============================================================

# form別クールダウン(秒)。プレイヤー × form 単位で独立して管理される。
# 0 または未定義 = 従来の計算クールダウン(連射増強で短縮される)にフォールバック。
# キーは form の NamespacedKey のキー部分。語彙は spell-form-vocabulary と同じ全10種。

form-cooldowns:
  projectile: 0
  beam: 0
  touch: 0
  self: 0
  underfoot: 0
  overhead: 0
  burst: 0
  orbit: 0
  linger: 0
  wall: 0
mana:
  per-glyph-unlock-bonus: 5
  max-percent-cap: 100
  source-auto-consume:
    # 自動消費のクールタイム(秒)。0以下でCT無し(2026-08-14 追加)。
    # スキルツリー ars_smithing の A-2「ソースベリー活用」の説明は当初から「100マナ/10CT」だったが、
    # CT判定は実装されておらずマナ不足のたびに無制限に変換できていた。既定の10はその説明に合わせた値。
    # CT中は変換が起きないので、従来の「対象アイテム不足」と同じくマナ不足で詠唱が不発になる。
    # ここは items の各行で cooldown-seconds を省略したときの既定値。
    cooldown-seconds: 10
    # 変換対象アイテム。キーは Ars カスタムアイテムid または TrinityForge カタログid。
    # 先頭の "custom:" は付けても付けなくてもよい(付いていれば読み込み時に落とす)。
    # 設定エディタのアイテム選択UIはカスタム品を "custom:" 付きで書き出すので、
    # 出荷値もそれに合わせておく(合わせないと editor 上で「候補外」表示になる)。
    #
    # 2種類の記法を書ける:
    #   source_berry: 100          … マナ変換量のみ。CTは上の cooldown-seconds
    #   source_berry:              … アイテムごとにCTを持たせる(2026-08-14 追加)
    #     mana: 100
    #     cooldown-seconds: 5      … 省略で上の既定値。0 は「このアイテムはCT無し」
    #
    # CTはアイテムごとに独立して進む。ソースベリーを使った直後でも別アイテムは即使える。
    items:
      custom:source_berry:
        mana: 100
        cooldown-seconds: 10
enchantments:
  mana-regen-per-level:
    - 0
    - 1
    - 3
    - 6
  mana-boost-per-level:
    - 0
    - 15
    - 30
    - 50
  max-level: 3
mob-drops:
  warden-echo-shard: false
  warden-echo-shard-min: 0
  warden-echo-shard-max: 2
pvp:
  enabled: true
cast-durability:
  enabled: true
  amount: 1
  respect-unbreaking: true
