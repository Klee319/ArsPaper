# ============================================================
# ArsPaper Configuration
# ============================================================
# プラグインの基本設定ファイル。
# スレッドの設定は threads.yml、グリフの設定は glyphs.yml、
# ソースリンク/ジャーは sourcelinks.yml / sourcejars.yml で管理する。
#
# 【2026-07-30 復旧】このファイルは 17c9f65「TrinityForge 連携の未コミット分を
# まとめて保存」で誤って sourcelinks.yml の内容(volcanic:/mycelial:/alchemical:/items:)へ
# 上書きされていた。ヘッダのコメントだけが残っていたのは
# 「先頭の連続する # ブロックだけを復元する」editor の保存仕様によるもの。
# getter が既定値を持つためエラーもログも出ず、稼働サーバでも
# form-cooldowns / mana / enchantments / mob-drops / loot が
# 全て「既定値のまま」で動いていた。
#
# 復旧時に 6b9e66a 版へ単純に戻すことはしていない —— マナ基礎値と
# ars-magic の EXP、geyser の CMD 設定は TrinityForge 側へ移管済みで、
# ここに書いても効かない「死にキー」になるため意図的に除外した。
#
# 【2026-08-16 訂正】上のうち マナ基礎値3項目
# (mana.default-max / mana.default-regen-rate / mana.regen-interval-ticks) は
# このファイルへ戻した。もう死にキーではなく、ここが真源である。
# 理由: TrinityForge の combat/base-stats.yml は stats/lore.yml に登録の無いキーを
# 設定エディタのどの画面にも出さないため、この3項目だけが「手編集でしか変えられない設定」
# として取り残されていた。今は設定エディタの「ArsPaper 全体設定 (config)」画面から編集できる。
# 旧キー(TrinityForge combat/base-stats.yml の mana-max-base / mana-regen-base /
# mana-regen-interval-ticks)は無視される。TF 側が起動時に警告を出すので、
# 稼働中サーバの base-stats.yml に残っていたら消してよい。
#
#   マナ基礎値3項目の真源 = このファイルの mana: セクション(下記)
#   マナ回復5項目の真源   = TrinityForge combat/base-stats.yml の
#     mana-onhit-percent / mana-onattack-percent / mana-idle-seconds /
#     mana-idle-bonus-percent / mana-idle-bonus-flat (ManaBaseStats 経由)
#     ※ こちらは移設していない。マナ設定が2箇所に分かれている点に注意。
#   ARS_MAGIC の EXP  = TrinityForge stats/skill-exp.yml
#
# 設定リファレンス(本文コメント移設先): docs/config-reference/arspaper/config.md
# ============================================================

# form別クールダウン(秒)。プレイヤー × form 単位で独立して管理される。
# 0 または未定義 = 従来の計算クールダウン(連射増強で短縮される)にフォールバック。
# キーは form の NamespacedKey のキー部分。語彙は spell-form-vocabulary と同じ全10種。

form-cooldowns:
  projectile: 0
  beam: 0
  touch: 0
  self: 0
  underfoot: 0
  overhead: 0
  burst: 0
  orbit: 0
  linger: 0
  wall: 0
mana:
  # 最大マナの土台(全プレイヤー共通)。グリフ解放・防具・スレッド・エンチャント・
  # スキルツリー由来の加算はすべてこの値の上に乗る。/ars status の「基本」行に出る値。
  # 0 以下を書くと 1 として扱う(最大マナ0だと魔法が一切撃てないため)。
  default-max: 100
  # 1インターバル(下の regen-interval-ticks)あたりの自然回復量。
  # 0 にすると自然回復が止まる(被弾/与ダメ/非詠唱ボーナスによる回復は別枠で残る)。
  default-regen-rate: 5
  # 自然回復の周期(tick)。20 = 1秒。小さいほど回復が細かく速くなる。
  # ⚠ 変更にはサーバ再起動が必要（/ars reload では変わらない）。
  #    回復タスクは起動時にこの周期を焼き込んで登録するため。
  #    /ars status の表示は「今動いている周期」なので、再起動するまで旧値のまま出る。
  # 0 以下を書くと 1 として扱う(0 tick 周期はタスクが壊れるため)。
  regen-interval-ticks: 20
  per-glyph-unlock-bonus: 5
  max-percent-cap: 100
  source-auto-consume:
    cooldown-seconds: 10
    items:
      custom:source_berry:
        mana: 100
        cooldown-seconds: 10
enchantments:
  mana-regen-per-level:
    - 0
    - 1
    - 3
    - 6
  mana-boost-per-level:
    - 0
    - 15
    - 30
    - 50
  max-level: 3
mob-drops:
  warden-echo-shard: true
  warden-echo-shard-min: 0
  warden-echo-shard-max: 1
pvp:
  enabled: true
# 詠唱1回あたりの耐久消費。減るのは触媒(杖)だけで、スペルをバインドしただけの
# 剣・ツルハシ・防具は減らない(2026-08-25)。触媒の判定は use-skill: ARS_MAGIC または
# spellbooks.yml の catalysts: 登録。
cast-durability:
  enabled: true
  amount: 1
  respect-unbreaking: true
