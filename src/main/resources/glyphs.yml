      #     heavy_impact)専用: 2026-08-02 以前は各グリフが「増幅1段+固定HP」を自分の基礎ダメージへ
      #     加算していた。杖の攻撃力(attack-power)は触媒側で別途加算されるため、杖が育つほど
      #     固定加算の相対的な価値が薄れる(触媒想定の環境で増幅が弱いという報告への対処)。
      #     ダメージ増加のエンチャント(Sharpness等)と同じ乗算方式に変更した:
      #     最終乗率 = 1 + damage-rate-per-stack × 増幅段数(Dampenで負にもなる)。
