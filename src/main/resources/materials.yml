  # ============================================================
  # ソース階梯の触媒 (2026-07-31 追加) — 「1億ソース」目標の生産側
  # ------------------------------------------------------------
  # 【ループの形】ソースを注いで触媒を作る -> その触媒をソースリンクへ焼べると、
  # 注いだ量より多くのソースが返る。返り倍率は段が上がるほど大きい
  # (sourcelinks.yml alchemical で設定。shard 5倍 -> engine 約18倍)。
  # つまり「素材(石炭/ソースジェム/ネザライト)の供給量」と「儀式を回す回数」だけが
  # 実質のボトルネックになる。クッキークリッカーの upgrade と同じ構造。
  #
  # 【儀式1回で4個できる理由】result-amount: 4。1段上へ行くには前段が8個要るので、
  # 4個ずつ出さないと儀式回数が段ごとに8倍に膨らみ、最終段まで4000回以上になってしまう。
  # 4個出しなら「engine 8個」までの必要儀式回数が概ね 16+8+4+2 = 30回程度に収まる。
  # ここが「作業厨で1ヶ月」に合わせる最重要レバーなので、重すぎ/軽すぎはこの数字で直す。
  #
  # 【見た目】いずれも custom_model_data を持つが、リソースパック側のモデルは未作成。
  # 未作成の CMD は上書きが引かれないので、当面はベースアイテム(アメジストの欠片など)の
  # 見た目で出る。テクスチャを足すときは既に採番済みのこの CMD をそのまま使うこと。
  # ============================================================
  source_shard:
    base_material: AMETHYST_SHARD
    custom_model_data: 5441
    display_name: "&bソースの欠片"
    enchant_glow: true
    lore:
      - "&7&o凝ったソースの結晶。焼べると注いだ量より多くが返る。"
      - ""
      - "&3焼べると 500 ソース"
    recipe:
      method: ritual
      core-item: AMETHYST_SHARD
      pedestal-items:
        - COAL x4
      source: 100
      result: custom:source_shard
      result-amount: 4
  source_crystal:
    base_material: PRISMARINE_CRYSTALS
    custom_model_data: 5442
    display_name: "&3ソース結晶"
    enchant_glow: true
    lore:
      - "&7&o欠片を束ねて育てた結晶。内側で光が回っている。"
      - ""
      - "&3焼べると 18,000 ソース"
    recipe:
      method: ritual
      core-item: custom:source_shard
      pedestal-items:
        - custom:source_shard x7
        - GLOWSTONE_DUST x4
      source: 2500
      result: custom:source_crystal
      result-amount: 4
  source_condenser:
    base_material: HEART_OF_THE_SEA
    custom_model_data: 5443
    display_name: "&9ソース凝縮器"
    enchant_glow: true
    lore:
      - "&7&o結晶を圧して作った核。触れると指先が痺れる。"
      - ""
      - "&3焼べると 700,000 ソース"
    recipe:
      method: ritual
      core-item: custom:source_crystal
      pedestal-items:
        - custom:source_crystal x7
        - custom:source_gem x4
      source: 60000
      result: custom:source_condenser
      result-amount: 4
  source_engine:
    base_material: CONDUIT
    custom_model_data: 5444
    display_name: "&5ソース機関"
    enchant_glow: true
    lore:
      - "&7&o自分でソースを回し始めた装置。もう止め方が分からない。"
      - ""
      - "&3焼べると 30,000,000 ソース"
    recipe:
      method: ritual
      core-item: custom:source_condenser
      pedestal-items:
        - custom:source_condenser x7
        - NETHERITE_INGOT x4
      source: 1000000
      result: custom:source_engine
      result-amount: 4
  infinity_source_core:
    base_material: NETHER_STAR
    custom_model_data: 5445
    display_name: "&6&l無限ソース核"
    enchant_glow: true
    lore:
      - "&7&oここまでに築いた貯蔵設備そのものを焚べた結果。"
      - "&7&o1億のソースが1点に折り畳まれている。"
      - ""
      - "&e第2の目標「1億ソース」の到達証明"
      - "&8※ 焼べられない(焼べたら証明が消える)"
    recipe:
      # 到達証明なので result-amount は 1。特異点の壺4個 + ソース機関8個を溶かす。
      # 「1億の証明」は文字どおり、それまでに積み上げた設備を焚べた結果になる。
      # 儀式コスト 4500万は「5個目の特異点の壺」に貯めてから回すことを想定している
      # (4個はペデスタルへ載せて溶けるので、燃料タンクは別に1個要る)。
      method: ritual
      core-item: custom:source_singularity_jar
      pedestal-items:
        - custom:source_singularity_jar x3
        - custom:source_engine x8
      source: 45000000
      result: custom:infinity_source_core
      result-amount: 1

