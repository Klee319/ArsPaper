# ============================================================
# materials.yml - 中間素材定義
# ============================================================
# 儀式で作成する中間素材アイテムの定義ファイル。
# 各素材はベースマテリアル・表示情報・儀式レシピを持つ。
#
# custom: プレフィックスは本プラグインのカスタムアイテムを参照する。
# "x2" 等の記法はアイテム数量を示す。
#
# 表示名の色は display_name 内の &カラーコードで指定する
# (旧 name_color パラメータは廃止し display_name へ統合済み)。
#
# enchant_glow: エンチャント光沢(キラキラ)を付与するか。省略時 true(従来どおり光る)。
#               false にするとその素材だけ光沢を消せる(例: 見た目を素朴にしたい鉱石系)。
#
# 圧縮ブロック系のレシピは「1段前の圧縮アイテム9個(不定形)」で統一。
# 1段目(_1x)のみバニラアイテム9個。
# ============================================================

materials:
  source_gem:
    base_material: PRISMARINE_SHARD
    custom_model_data: 100011
    display_name: "&bソースジェム"
    lore:
      - "&7魔力を帯びた結晶"
      - ""
      - "&5全ての源"
    recipe:
      method: ritual
      core-item: LAPIS_LAZULI
