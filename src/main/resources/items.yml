  # スレッド枠拡張の儀式(Ⅰ→Ⅲ)。
  # max-slots は「この儀式1回で足す枠数」ではなく、装備に刻まれた儀式由来の累計付与カウンタ
  # (TrinityForge の PDC `ritual_thread_slot_bonus`)に対する上限値である。3本の儀式は
  # 同じ1個のカウンタを共有し、ItemFactory#expandRitualThreadSlot が
  # 「現在の累計 >= その儀式の max-slots なら失敗(素材もソースも消費しない)」と判定して +1 する。
  # したがって上位の儀式ほど max-slots を大きくしないと、下位で累計が埋まった時点で
  # 上位が永久に失敗する「死に儀式」になる(Ⅱ が Ⅰ と同じ 1 だった状態がこれ)。
  # 実際の上限は別途 TrinityForge の progression/crafting-features.yml
  # `thread-slots.max-by-category`(現在 armor/weapon/tool/other すべて 5)でも頭打ちになる。
  # 装備の基礎 thread-slots が 2〜3 なので、Ⅲ の 5 は「カテゴリ上限まで解放」を意味する。
  thread_slot_expand_ritual:
    name: スレッド枠拡張の儀式Ⅰ
    effect-type: thread_slot_expand
    effect-params:
      # 儀式由来の累計枠が 1 に達するまで(=1回だけ)成功する。
      max-slots: 1
    pedestal-items:
      - custom:source_gem_block x3
      - DIAMOND x4
    source: 5000
  thread_slot_expand_ritual_2:
    name: スレッド枠拡張の儀式Ⅱ
    effect-type: thread_slot_expand
    effect-params:
      # 累計 2 まで解放。Ⅰ の後(累計1)から更に +1 できる。
      max-slots: 2
    pedestal-items:
      - custom:source_gem_block_1x x3
      - DIAMOND_BLOCK x4
      - NETHER_STAR
    source: 25000
  thread_slot_expand_ritual_3:
    name: スレッド枠拡張の儀式Ⅲ
    effect-type: thread_slot_expand
    effect-params:
      # 累計 5(=カテゴリ上限と同値)まで解放。実際にはカテゴリ上限に当たった時点で止まる。
      max-slots: 5
    pedestal-items:
      - custom:source_engine x4
      - custom:reality_thread_core x4
      - custom:abyssal_ingot
    source: 100000
