# ============================================================
# items.yml - アイテムレシピ & 儀式エフェクト定義
# ============================================================
# items:          アイテムを生成するレシピ（作業台 or 儀式）
# ritual_effects: ワールドエフェクト儀式（アイテム結果なし）
#
# レシピ記法:
#   method: workbench  - 作業台クラフト (type, shape, ingredients, amount)
#   method: ritual     - 儀式クラフト (core-item, pedestal-items, source, result)
#
# custom: プレフィックスは本プラグインのカスタムアイテムを参照する。
# "x2" 等の記法はアイテム数量を示す。
# ============================================================

# ============================================================
# アイテムレシピ
# ============================================================

# 注(2026-07-25): 機能アイテム(dominion_wand/teleport_compass/pedestal/ritual_core/
#     scribing_table/waystone/source_berry)のレシピは全て functional-items.yml へ統合済み。
#     カタログ登録済みの通常アイテム(source_gem系, sourcestone, magebloom_fiber, スレッド,
#     魔導書等)のレシピは引き続き TrinityForge items/catalog.yml 側。
#
# 注(2026-08-14): エンチャント本8件(enchant_book_*)も functional-items.yml へ移した。
#     設定エディタの本ファイル用画面は ritual_effects: しか描画しないため、
#     items: に置いたエントリは editor から見ることも編集することもできなかった
#     (ユーザー報告「回生とマナ関連のエンチャント本の儀式レシピが消えている」の正体)。
#     残る items: の2件(trident / エンチャントされた金リンゴ)も同じ理由で editor 非表示。
#     どちらもバニラアイテムを結果に持つレシピで「特殊アイテム」画面の対象外なので、
#     移設せず reports/ACTIVE_RECORD.md の残タスクとして追跡する。

items:
  trident:
    recipe:
      method: workbench
      type: shaped
      shape:
        - " CP"
        - " AC"
        - "D  "
      ingredients:
        P: PRISMARINE_SHARD
        C: PRISMARINE_CRYSTALS
        D: DIAMOND_BLOCK
        A: COPPER_BLOCK
      result: TRIDENT
  エンチャントされた金リンゴ:
    recipe:
      method: ritual
      core-item: APPLE
      pedestal-items:
        - GOLD_BLOCK x4
        - TOTEM_OF_UNDYING x2
        - NETHERITE_INGOT x2
      source: 3000
      result: ENCHANTED_GOLDEN_APPLE
