# ============================================================
# ArsPaper スレッド定義ファイル
# ============================================================
# 各スレッドの効果・重複設定を一元管理する。
#
# 【レシピについて】儀式レシピは TrinityForge items/catalog.yml 側に統一済み。
# 各 thread_<id> エントリの recipe（ritual）を catalog で編集すること
# （catalog経由でArsの儀式レジストリへ供給される）。
#
# display_name: スレッドアイテムの表示名
# 効果パラメータ（スレッドタイプに応じて設定）:
#   regen-bonus: マナ回復速度ボーナス（/tick）
#   mana-bonus: 最大マナボーナス
#   recovery: マナ回復量（被弾/攻撃時）
#     ⚠ 振り分けは ThreadConfig.java の key.contains("hit") という【id の文字列判定】。
#       id に hit を含まないスレッドに recovery: を書くと、無言で「攻撃時マナ回復」に化ける。
#   cost-reduction: スペルコスト軽減率（%）
#   mana-max-percent: 最大マナの割合上昇（%）。固定値の mana-bonus と違い、素の最大マナが
#     大きいビルドほど効く。ThreadConfig / ManaManager とも配線済み。
#   regen-percent: マナ回復速度の割合上昇（%）。固定値の regen-bonus の割合版。
#   slots: バックパック1本あたりの枠数。BackpackGui が本数×この値を容量にする。
#     0 を書くと説明文が「追加インベントリ 0スロット」と嘘をつく。
#   max-inventory-slots: 1装備あたりの総枠上限。未記載なら slots × max。
#     54 を超える分は最下段のページ送りで見る。容量を超えた PDC の中身は消さない。
#     ⚠ 数えるのは【1つの防具の PDC だけ】。別の部位に挿した本数は合算されない。だから
#       backpack だけは 2026-08-25 (W-254) の「1装備1本」から除外して max: 4 を残してある
#       （4×slots=108 で max-inventory-slots に届く。54超はページ送り）。
#   potion-effect: 装備中常時付与するポーション効果（バニラ PotionEffectType 名を小文字にしたid）。
#     省略時は ThreadType enum の既定値を使う（後方互換）。"none" と書くと明示的に無効化できる。
#     ⚠ 指定できるのは有益効果18種のみ:
#       speed / haste / strength / jump_boost / regeneration / resistance / fire_resistance /
#       water_breathing / invisibility / night_vision / health_boost / absorption / saturation /
#       luck / slow_falling / conduit_power / dolphins_grace / hero_of_the_village
#       instant_health 等の即時系（毎tick付け直すと無限回復になる）や有害効果を書いた場合は
#       起動時に警告ログを出して既定値へフォールバックする（起動は止めない）。
#   potion-level: potion-effect のレベル（1以上の整数）。1 = 効果I。省略時は1。
#     内部の amplifier は level-1。同じ型を複数のスレッドが与える場合、装備全体では
#     amplifier の最大値（=最高レベル）が採用される。
#   flight: 装備中ずっとエリトラ飛行を許可するか（true/false）。省略時は ThreadType enum の
#     既定値（flight スレッドのみ true）を使う。
#   lore: 説明文1行。色は Java が紫で塗るのでタグは不要。2行以上書いても先頭以外は出ない。
#     ⚠ 効果の実体が thread-sets.yml のセット効果側にあるスレッドは、上の数値キーを1つも
#       持たないため【何も書かないと説明文が0行になる】。必ず lore: を書くこと。
#
# ⚠ display_name: は【誰も読んでいない】。表示名は ThreadType enum が正で、ここの値は飾り。
#   ここを直しても実機の名前は変わらないので、名前を変えるときは enum を直すこと。
#
# stackable / max: 【2026-08-25 (W-254) に廃止】
#   ★ユーザー確定要件「同じスレッドは同じ部位に1つまでしか付けられないように修正する」。
#     ThreadApplicationPolicy.DEFAULT_MAX_STACK を 1 にしたので、この2キーは書かなくても
#     全スレッドが「1装備につき同種1本」になる。出荷 yml からは backpack を除いて全部落とした。
#   ⚠ 例外は backpack の max: 4 だけ。戦闘ステを持たないので上限張り付きの問題が無い。
#     1本あたりの枠は slots、総枠天井は max-inventory-slots。4本で 108 に届き、54超はページ送り。
#   ⚠ なぜ上限を1にしたか: 回避率・ダメージ軽減率のような割合ステは、同じ種を枠へ集中させると
#     合計が上限(0.9)へ張り付き、そこから先の装備更新が一切効かなくなる(=バランスが壊れる)。
#     1装備1本にすると同種の総数はキャリア数(着用防具4部位＋メインハンド＝5)で頭打ちになる。
#   ⚠ この変更で thread-sets.yml の到達可能な最大しきい値は 10 → 【5】になった。
#     6段以上を書くと物理的に発動しない(ThreadSetThresholdReachabilityTest が落ちる)。
#   ⚠ 2キーはコード側にまだ残してある(ThreadConfig が読む)。特定の種だけ重複を許したく
#     なったときに yml から復活できるが、上の理由を読んでから足すこと。
# ============================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/arspaper/threads.md

threads:
  empty:
    display_name: 空のスレッド
  mana_regen:
    display_name: マナ回復速度上昇のスレッド
    lore:
      - マナの巡りを速める
  mana_boost:
    display_name: マナ最大値上昇のスレッド
    lore:
      - 器を広げる
  health_boost:
    display_name: 体力増強のスレッド
    lore:
      - 体の器を底上げする
    potion-effect: health_boost
    potion-level: 2
  hit_mana_recovery:
    display_name: 被弾マナ回復のスレッド
    lore:
      - 痛みをマナに還す
  damage_mana_recovery:
    display_name: 攻撃マナ回復のスレッド
    lore:
      - 一撃ごとにマナを汲む
  spell_cost_down:
    display_name: 詠唱効率のスレッド
    lore:
      - 詠唱の浪費を抑える
  backpack:
    display_name: バックパックのスレッド
    lore:
      - 持ち物を増やす
    slots: 27
    # 1装備あたりの総枠上限。slots × 本数がこれを超えたらここで切る。54超はページ送り。
    max-inventory-slots: 108
    # 【W-254 の例外】戦闘ステを持たないので1装備複数本を許可。
    #   本数の上限はここ、1本あたりの枠は slots、総枠の天井は max-inventory-slots。
    #   4本 × 27 = 108 で天井に届く。54超はページ送り。
    max: 4
  speed:
    display_name: 迅速のスレッド
    lore:
      - 足元を軽くする
    potion-effect: speed
    potion-level: 2
  jump_boost:
    display_name: 跳躍のスレッド
    lore:
      - 踏切を高くする
    potion-effect: jump_boost
    potion-level: 2
  night_vision:
    display_name: 暗視のスレッド
    lore:
      - 闇を見通す
    potion-effect: night_vision
    potion-level: 1
  stealth:
    display_name: 隠密のスレッド
    lore:
      - 気配を断ち、姿を消す
    potion-effect: invisibility
    potion-level: 1
    # 2026-08-25 (W-256) 追加。透明化は防具に挿したときだけ走る
    # (ThreadApplicationPolicy#isAmbientOnlyEffect が常時ポーション効果を防具限定にしている)。
    # ⚠ potion-level は 1 のまま。透明化に強度の概念は無く、2以上にしても効果は変わらないのに
    #   lore だけ「II」と出て嘘になる。
  fire_resistance:
    display_name: 耐火のスレッド
    lore:
      - 炎を受け流す
    potion-effect: fire_resistance
    potion-level: 1
  dolphins_grace:
    display_name: イルカの好意のスレッド
    lore:
      - 水中を泳ぐように進む
    potion-effect: dolphins_grace
    potion-level: 1
  conduit_power:
    display_name: コンジットパワーのスレッド
    lore:
      - 海の加護を纏う
    potion-effect: conduit_power
    potion-level: 1
  # ⚠ 村の英雄は percent-bonus-damage を1本あたり +6% 配る突出枠で、次点(棘の +2.5%)の
  #   2.4倍ある。2026-08-25 (W-254) に【全スレッドが1装備1本まで】へ変わったので個別の
