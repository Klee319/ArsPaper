# ============================================================
# ArsPaper スレッド定義ファイル
# ============================================================
# 各スレッドの効果・重複設定を一元管理する。
#
# 【レシピについて】儀式レシピは TrinityForge items/catalog.yml 側に統一済み。
# 各 thread_<id> エントリの recipe（ritual）を catalog で編集すること
# （catalog経由でArsの儀式レジストリへ供給される）。
#
# display_name: スレッドアイテムの表示名
# 効果パラメータ（スレッドタイプに応じて設定）:
#   regen-bonus: マナ回復速度ボーナス（/tick）
#   mana-bonus: 最大マナボーナス
#   recovery: マナ回復量（被弾/攻撃時）
#     ⚠ 振り分けは ThreadConfig.java の key.contains("hit") という【id の文字列判定】。
#       id に hit を含まないスレッドに recovery: を書くと、無言で「攻撃時マナ回復」に化ける。
#   cost-reduction: スペルコスト軽減率（%）
#   mana-max-percent: 最大マナの割合上昇（%）。固定値の mana-bonus と違い、素の最大マナが
#     大きいビルドほど効く。ThreadConfig / ManaManager とも配線済み。
#   regen-percent: マナ回復速度の割合上昇（%）。固定値の regen-bonus の割合版。
#   slots: バックパックスロット数。⚠ これは **lore の表示専用**（ThreadConfig#getBackpackSlots を
#     読むのは説明文の生成1箇所だけ）。実際の容量は BackpackGui が
#     「装着しているバックパックスレッドの本数（max: 2 が上限）× 3行 × 9 = 27 or 54」で決めるので、
#     ここには **1本あたりの枠数（=27）** を書く。0 を書くと説明文が「追加インベントリ 0スロット」と嘘をつく。
#   potion-effect: 装備中常時付与するポーション効果（バニラ PotionEffectType 名を小文字にしたid）。
#     省略時は ThreadType enum の既定値を使う（後方互換）。"none" と書くと明示的に無効化できる。
#     ⚠ 指定できるのは有益効果18種のみ:
#       speed / haste / strength / jump_boost / regeneration / resistance / fire_resistance /
#       water_breathing / invisibility / night_vision / health_boost / absorption / saturation /
#       luck / slow_falling / conduit_power / dolphins_grace / hero_of_the_village
#       instant_health 等の即時系（毎tick付け直すと無限回復になる）や有害効果を書いた場合は
#       起動時に警告ログを出して既定値へフォールバックする（起動は止めない）。
#   potion-level: potion-effect のレベル（1以上の整数）。1 = 効果I。省略時は1。
#     内部の amplifier は level-1。同じ型を複数のスレッドが与える場合、装備全体では
#     amplifier の最大値（=最高レベル）が採用される。
#   flight: 装備中ずっとエリトラ飛行を許可するか（true/false）。省略時は ThreadType enum の
#     既定値（flight スレッドのみ true）を使う。
#   lore: 説明文（文字列 or 文字列のリスト）。ここに書いた行はそのままアイテムの lore に出る。
#     ⚠ 効果の実体が thread-sets.yml のセット効果側にあるスレッドは、上の数値キーを1つも
#       持たないため【何も書かないと説明文が0行になる】。必ず lore: を書くこと。
#
# ⚠ display_name: は【誰も読んでいない】。表示名は ThreadType enum が正で、ここの値は飾り。
#   ここを直しても実機の名前は変わらないので、名前を変えるときは enum を直すこと。
#
# stackable: 同じ装備に同じスレッドを複数セットできるか
#   ★2026-08-18 に【既定が true（重複可）へ反転】した（ユーザー確定要件「同一のスレッドを
#     重複で入れられるようにしてほしい」）。旧既定 false のままだと thread-sets.yml の
#     6段のしきい値が【物理的に発動しない】（1装備1本 × キャリア5 = 上限5本）。
#   true / 未記載: 重複可能（max で1装備あたりの上限を指定）
#   false: 1つの装備に1つまで（明示したときだけ）
#   ※ 飛行/耐火/暗視のような常時効果は重複しても強くならない（ポーションは最大レベル採用・
#     飛行は真偽値）が、厳選ステと thread-sets のセット効果は本数ぶん効くので重複は無駄ではない。
# max: 1つの装備にセットできる最大数（未設定 = ThreadApplicationPolicy.DEFAULT_MAX_STACK = 2）
#   ⚠ 未設定を「無制限」にしてはいけない。防具のスレッド枠は帯ごとに 2/3/4 枠（合計 8/12/16）で、
#     TF 側 ShippedThreadBandIndependenceTest の帯目標（+39%/+49%/+59%）は「1種へ全枠を
#     集中できない」前提で較正されている。上限を外すと最良編成が最強1種への全振りに化ける。
# ============================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/arspaper/threads.md

threads:
  empty:
    display_name: 空のスレッド
  mana_regen:
    display_name: マナ回復速度上昇のスレッド
    stackable: true
    max: 3
  mana_boost:
    display_name: マナ最大値上昇のスレッド
    stackable: true
    max: 3
  health_boost:
    display_name: 体力増強のスレッド
    stackable: true
    max: 3
    potion-effect: health_boost
    potion-level: 2
  hit_mana_recovery:
    display_name: 被弾マナ回復のスレッド
    stackable: true
    max: 2
  damage_mana_recovery:
    display_name: 攻撃マナ回復のスレッド
    stackable: true
    max: 2
  spell_cost_down:
    display_name: 詠唱効率のスレッド
    stackable: true
    max: 1
  backpack:
    display_name: バックパックのスレッド
    stackable: true
    max: 2
    slots: 27
  speed:
    display_name: 迅速のスレッド
    potion-effect: speed
    potion-level: 2
  jump_boost:
    display_name: 跳躍のスレッド
    potion-effect: jump_boost
    potion-level: 2
  night_vision:
    display_name: 暗視のスレッド
    potion-effect: night_vision
    potion-level: 1
  fire_resistance:
    display_name: 耐火のスレッド
    potion-effect: fire_resistance
    potion-level: 1
  dolphins_grace:
    display_name: イルカの好意のスレッド
    potion-effect: dolphins_grace
    potion-level: 1
  conduit_power:
    display_name: コンジットパワーのスレッド
    potion-effect: conduit_power
    potion-level: 1
  # ⚠ 村の英雄だけ max: 1（=同一装備に1本まで。装備が違えばキャリア5個ぶん重複できる）。
  #   このスレッドは percent-bonus-damage を1本あたり +6% 配る唯一の突出枠で、次点(棘の +2.5%)の
  #   2.4倍ある。既定の max: 2 を許すと防具4部位で8本になり、TF 側
  #   ShippedThreadBandIndependenceTest の帯目標(+39%/+49%/+59%)を全帯で +22.0pt 超過する
  #   （実測。目標値は 2026-08-14 の戦闘リワークで「1装備1本」前提に較正されている）。
  #   ここを 2 以上にしたいなら、先に item-stats.yml の1本あたりの割合ダメージを下げること。
  hero_of_the_village:
    max: 1
    display_name: 村の英雄のスレッド
    potion-effect: hero_of_the_village
    potion-level: 1
  flight:
    display_name: 飛行のスレッド
    flight: true
  mana_amplify:
    display_name: マナ増幅のスレッド
    stackable: true
    max: 3
  mana_circulate:
