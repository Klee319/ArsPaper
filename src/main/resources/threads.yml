# ============================================================
# ArsPaper スレッド定義ファイル
# ============================================================
# 各スレッドの効果・重複設定を一元管理する。
#
# 【レシピについて】儀式レシピは TrinityForge items/catalog.yml 側に統一済み。
# 各 thread_<id> エントリの recipe（ritual）を catalog で編集すること
# （catalog経由でArsの儀式レジストリへ供給される）。
#
# display_name: スレッドアイテムの表示名
# 効果パラメータ（スレッドタイプに応じて設定）:
#   regen-bonus: マナ回復速度ボーナス（/tick）
#   mana-bonus: 最大マナボーナス
#   recovery: マナ回復量（被弾/攻撃時）
#     ⚠ 振り分けは ThreadConfig.java の key.contains("hit") という【id の文字列判定】。
#       id に hit を含まないスレッドに recovery: を書くと、無言で「攻撃時マナ回復」に化ける。
#   cost-reduction: スペルコスト軽減率（%）
#   mana-max-percent: 最大マナの割合上昇（%）。固定値の mana-bonus と違い、素の最大マナが
#     大きいビルドほど効く。ThreadConfig / ManaManager とも配線済み。
#   regen-percent: マナ回復速度の割合上昇（%）。固定値の regen-bonus の割合版。
#   slots: バックパックスロット数
#   potion-effect: 装備中常時付与するポーション効果（バニラ PotionEffectType 名を小文字にしたid）。
#     省略時は ThreadType enum の既定値を使う（後方互換）。"none" と書くと明示的に無効化できる。
#     ⚠ 指定できるのは有益効果18種のみ:
#       speed / haste / strength / jump_boost / regeneration / resistance / fire_resistance /
#       water_breathing / invisibility / night_vision / health_boost / absorption / saturation /
#       luck / slow_falling / conduit_power / dolphins_grace / hero_of_the_village
#       instant_health 等の即時系（毎tick付け直すと無限回復になる）や有害効果を書いた場合は
#       起動時に警告ログを出して既定値へフォールバックする（起動は止めない）。
#   potion-level: potion-effect のレベル（1以上の整数）。1 = 効果I。省略時は1。
#     内部の amplifier は level-1。同じ型を複数のスレッドが与える場合、装備全体では
#     amplifier の最大値（=最高レベル）が採用される。
#   flight: 装備中ずっとエリトラ飛行を許可するか（true/false）。省略時は ThreadType enum の
#     既定値（flight スレッドのみ true）を使う。
#   lore: 説明文（文字列 or 文字列のリスト）。ここに書いた行はそのままアイテムの lore に出る。
#     ⚠ 効果の実体が thread-sets.yml のセット効果側にあるスレッドは、上の数値キーを1つも
#       持たないため【何も書かないと説明文が0行になる】。必ず lore: を書くこと。
#
# ⚠ display_name: は【誰も読んでいない】。表示名は ThreadType enum が正で、ここの値は飾り。
#   ここを直しても実機の名前は変わらないので、名前を変えるときは enum を直すこと。
#
# stackable: 同じ防具に同じスレッドを複数セットできるか
#   true: 重複可能（maxで上限を指定可能）
#   false: 1つの防具に1つまで
#   ※ 仕様上重複が無意味なスレッド（飛行/耐火/暗視等）は設定不要（常に不可）
# max: 1つの防具にセットできる最大数（stackable: trueの場合のみ有効、未設定=無制限）
# ============================================================

# 設定リファレンス(本文コメント移設先): docs/config-reference/arspaper/threads.md
threads:

  empty:
    display_name: "空のスレッド"


  mana_regen:
    display_name: "マナ回復速度上昇のスレッド"
    regen-bonus: 2
    stackable: true
    max: 3

  mana_boost:
    display_name: "マナ最大値上昇のスレッド"
    mana-bonus: 20
    stackable: true
    max: 3

  health_boost:
    display_name: "体力増強のスレッド"
    stackable: true
    max: 3

  hit_mana_recovery:
    display_name: "被弾マナ回復のスレッド"
    recovery: 10
    stackable: true
    max: 2

  damage_mana_recovery:
    display_name: "攻撃マナ回復のスレッド"
    recovery: 5
    stackable: true
    max: 2

  spell_cost_down:
    display_name: "詠唱効率のスレッド"
    cost-reduction: 8
    stackable: true
    max: 1

  backpack:
    display_name: "バックパックのスレッド"
    slots: 27
    stackable: true
    max: 2


  speed:
    display_name: "迅速のスレッド"

  jump_boost:
    display_name: "跳躍のスレッド"

  night_vision:
    display_name: "暗視のスレッド"

  fire_resistance:
    display_name: "耐火のスレッド"

  dolphins_grace:
    display_name: "イルカの好意のスレッド"

  conduit_power:
    display_name: "コンジットパワーのスレッド"

  hero_of_the_village:
    display_name: "村の英雄のスレッド"

  flight:
    display_name: "飛行のスレッド"


# ============================================================
# 2026-08-02 追加分（16種 -> 40種）。CMD 300017〜300040 / ThreadType enum と1:1。
#
# ■ stackable を書いていないもの = 1装備につき1個まで（到達上限 = キャリア5個）。
#   これは意図的: 効果を thread-sets.yml の 1/3/5 段で表現しているので、
#   最終段の 5 が「防具4部位+メインハンド の全部に載せて初めて到達」になる。
#   stackable: true にすると上限が跳ね上がり、5 段が「1装備に固めて即到達」に化ける。
#
# ■ 効果値そのものは thread-sets.yml 側に書く（このファイルには重複して書かない）。
#   ここの lore: は「プレイヤーに見せる説明文」であって効果の定義ではない。
#   数値を変えたら lore: も手で直すこと（自動追随はしない）。
# ============================================================

  # --- 制作(儀式・生産)枠。効果値は設計の基準どおり ---

  mana_amplify:
    display_name: "マナ増幅のスレッド"
    # 割合なので「素の最大マナが大きいビルドほど効く」。固定+20 の mana_boost と伸び方が逆になる。
    mana-max-percent: 3
    stackable: true
    max: 3

  mana_circulate:
    display_name: "循環のスレッド"
    # 回復基礎値を伸ばした構成でだけ意味が出る割合版。固定+2/tick の mana_regen と対になる。
    regen-percent: 4
    stackable: true
    max: 3

  source_thrift:
    display_name: "源流節約のスレッド"
    # spell_cost_down が削るのは「マナ」。こちらは儀式の「ソース」で消費資源そのものが別。

  artisan:
    display_name: "匠のスレッド"

  ritualist:
    display_name: "儀式師のスレッド"

  thrift:
    display_name: "倹約のスレッド"
    # 儀式の台座素材がまれに返ってくる（RitualManager の material_refund_chance）。

  salvage:
    display_name: "解体のスレッド"

  scholar:
    display_name: "選書のスレッド"

  # --- ルート(採取・生活)枠。効果値は基準の約1.2倍 ---

  miner:
    display_name: "豊鉱のスレッド"
    # 採掘「速度」は統合版でゴーストブロックになるので絶対に触らない。ドロップ量だけ。

  angler:
    display_name: "潮読みのスレッド"
    # fishing-luck は stats/lore.yml で format: PERCENT なので、実機の /tf stats には
    # 「+2%」のようにパーセントで出る。ここに生の小数(0.024)を書くと
    # 「lore は 0.024 なのにステ画面は +2%」という別物に見える表示になるため、
    # 他23種と同じくパーセント表記で書く(値そのものは thread-sets.yml のまま)。

  harvest:
    display_name: "実りのスレッド"

  timber:
    display_name: "年輪のスレッド"

  diligence:
    display_name: "研鑽のスレッド"
    # 育成中だけ挿して育ち切ったら外す「一時的に挿す枠」。

  endurance:
    display_name: "持久のスレッド"

  gourmet:
    display_name: "美食のスレッド"

  slow_falling:
    display_name: "浮遊のスレッド"
    # 滑空する flight と違い「落ちても死なない」。洞窟・建築・崖で効く。
    # セット効果が 3 段からなのは、1個分の効果を「装備中常時の落下速度低下」が担当しているため
    # (既存8種のポーションスレッドと横並び)。数値は累計で、catalog.yml の表記と一致させてある。

  # --- ダンジョン(戦闘)枠。効果値は基準の約1.5倍 ---

  spoils:
    display_name: "戦利品のスレッド"
    # 「倒す力」ではなく「倒した後の取り分」。火力を上げずに周回効率だけ上げる横方向の枠。

  experience:
    display_name: "経験のスレッド"

  mending_flesh:
    display_name: "治癒のスレッド"
    # health_boost は「最大HPを増やす」。こちらは「戻る速さ」で戦闘間のダウンタイムに効く。

  thorn:
    display_name: "棘のスレッド"

  concussion:
    display_name: "昏倒のスレッド"
    # ダメージを増やさず「通す回数」を増やす状態異常軸。

  swiftcast:
    display_name: "速攻のスレッド"
    # 短縮対象は【アイテムの使用クールダウン】(item-cooldown を持つ武器)。
    # Ars の詠唱コストでもアクティブスキルCTでもない。

  marksman:
    display_name: "射手のスレッド"
    # 火力に直結する arrow-piercing / velocity は避け、消費と精度だけを触る。
    # 数値は thread-sets.yml のしきい値を積んだ【累計】(他23種と同じ書式)。
    # 5個の 10.5% は 1段目 4.5% + 5段目 6.0% の合計であって、5段目の増分 6.0% ではない。
    # ここだけ増分で書くと、同じ書式なのに1種類だけ意味が違う = catalog.yml の
    # 「5個で10.5%」とも食い違う(2026-08-02 訂正)。

  luck:
    display_name: "幸運のスレッド"
    # バニラのルートテーブル(quality/bonus_rolls)に効く唯一の手段。TF の loot 系ステとは別レイヤ。
    # slow_falling と同じ理由でセット効果は 3 段から。数値は累計で、catalog.yml の表記と一致させてある。

  # ------------------------------------------------------------------
  # 2026-08-03 追加5種。儀式レシピを持たず、TF の gacha.yml の景品としてしか出ない。
  # 効果の実体は下記2箇所で、ここには数値キーを1つも書かない:
  #   ・1個ぶんの効果 ... thread-sets.yml の【しきい値1段目=1】(ソケット済みしか数えないので
  #     手持ちでは発動しない)。
  #   ・厳選ぶんの効果 ... TF stats/item-stats.yml の per-quality / random / grant-chances。
  # 数値キーが無いスレッドは lore: を書かないと説明文が0行になるので、必ず書く。
  # ------------------------------------------------------------------
  perfumer:
    display_name: "調香のスレッド"

  apiarist:
    display_name: "養蜂のスレッド"

  herder:
    display_name: "牧人のスレッド"

  appraiser:
    display_name: "鑑識のスレッド"

  excavation:
    display_name: "削岩のスレッド"
    # gathering-efficiency は「効率強化エンチャントのレベル」として実行時に反映される
    # (バニラ属性の採掘速度は統合版で使えないため。TF stats/gathering-efficiency.yml 参照)。
