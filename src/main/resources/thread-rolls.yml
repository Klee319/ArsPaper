# ArsPaper - スレッドの厳選(ランダムステータス) 定義 (thread-rolls.yml)
#
# スレッドを1個作るたびに「主ステータス1つ + サブステータス0〜4つ」を抽選して個体差を付ける。
# 原神の聖遺物と同じ形: つくステの種類・本数・数値のすべてがランダムなので、同じ種類の
# スレッドでも当たり外れが出る。ここが「楽しい範囲の沼厳選」の本体。
#
# ■ 抽選の順序(実装と一致させて読むこと)
#   1. rarities から weight で1つ引く   -> 主ステの値へ multiplier が掛かる(サブには掛からない)
#   2. main-stats から weight で1つ引く -> min..max の一様乱数 x multiplier
#   3. sub-count から weight で本数を引く
#   4. sub-stats から重複なしで本数分引く(主ステと同じキーは引かない)
#
# ■ ステータスキーは TrinityForge の語彙をそのまま使う
#   攻撃系: attack-power / flat-bonus-damage / percent-bonus-damage / crit-chance /
#           crit-damage / penetration / bleed-chance / bleed-damage
#   防御系: phys-resistance / magic-resistance / phys-flat-defense / magic-flat-defense /
#           damage-reduction / dodge-chance / armor-strength
#   ※ armor-defense-rate は【意図的に候補へ入れていない】。バニラ防具の防御率(上限0.8)へ
#     加算されるため、厳選で盛れると貫通0の相手からの物理を実質無効化できてしまう。
#
# ■ percent: 表示だけの指定。true なら lore に "+3.5%" と出す(保存値は 0.035 のまま)。
#   数値そのままで意味を持つステ(attack-power / *-flat-defense / bleed-damage 等)は false。
#
# ■ 数値の規模の考え方
#   スレッドは防具4部位 x thread-slots(1式9枠)まで装着できる。つまり主ステは最大9個乗る。
#   attack-power を例に取ると 9 x 400 x 1.8 ≈ 6480 で、インフィニティの剣(37800)の約17%。
#   「装備の乗り換えより厳選のほうが強い」状態にはしない、が目安。
#   さらに TrinityForge 側の stat-caps がキー単位で最終上限を掛けるので、暴走はしない。
#
# ■ 既存のスレッドには影響しない
#   厳選値はスレッドを生成した瞬間にそのアイテムへ焼き込む(PDC)。ここの min/max を後から
#   変えても、既に配ったスレッドの数値は変わらない(儀式 thread_reroll で振り直せる)。

# 設定リファレンス(本文コメント移設先): docs/config-reference/arspaper/thread-rolls.md
enabled: true

# レア度。主ステの値に multiplier が掛かり、label が lore の先頭に出る。
rarities:
  common:
    weight: 55
    multiplier: 1.0
    label: "並"
    color: GRAY
  rare:
    weight: 28
    multiplier: 1.2
    label: "希"
    color: AQUA
  epic:
    weight: 13
    multiplier: 1.45
    label: "極"
    color: LIGHT_PURPLE
  legend:
    weight: 4
    multiplier: 1.8
    label: "神"
    color: GOLD

