name: ArsPaper
version: "0.1.0-SNAPSHOT"
main: com.arspaper.ArsPaper
bootstrapper: com.arspaper.enchant.ArsBootstrap
description: Ars Nouveau-inspired magic plugin for Paper servers
api-version: "1.21"
author: Klee319

# TrinityForge 統合アドオンを先にロードし、クラスパスを結合する。
# 魔法ダメージを対称ダメージパイプライン(magicalFinalDamage)へ供給するため必須。
dependencies:
  server:
    TrinityForge:
      load: BEFORE
      required: true
      join-classpath: true

permissions:
  arspaper.use:
    description: Basic ArsPaper usage
    default: true
  arspaper.admin:
    description: ArsPaper admin commands
    default: op
