# =============================================================================
# Sourcelink Material Values Configuration
# =============================================================================
# Each sourcelink type has a "materials" section mapping item ids to
# source point values. You can add, remove, or modify entries freely.
#
# Keys may be:
#   - Bukkit Material names (COAL, COOKED_BEEF, ...)
#   - custom:<arsItemId> or bare registered item ids (e.g. custom:source_gem)
#   - TrinityForge catalog ids (matched via catalog PDC)
#
# YAML tip: quote keys that contain ':'  →  "custom:source_gem": 10
# =============================================================================

# --- Volcanic Sourcelink (FURNACE) ---
# Fuel items consumed to generate Source.
# Reference: coal (1600 burn ticks) = 5 source points
# 設定リファレンス(本文コメント移設先): docs/config-reference/arspaper/sourcelinks.md
