  # ===========================================================================
  # 上位ソースリンク階梯 (2026-08-02 追加/2026-08-03 拡張)
  # ---------------------------------------------------------------------------
  # 【解消した問題 その1: レート】それまでソースリンクは5種が1個ずつしか存在せず、転送レート
  #   (max-per-transfer)は全リンク共通の1値だったため、レートを上げる唯一の手段が
  #   「同種リンクを並べて置くこと」になっていた(K-16)。
  #
  # 【解消した問題 その2: 生成量】2026-08-02 の階梯は転送レートしか上げなかったので、
  #   上位リンクへ燃料を1個焼べても得られるソースは無印と同じ = 素材効率が階梯で改善しなかった。
  #   2026-08-03 に yield-multiplier を追加して「生成量」も階梯で伸びるようにした。
  #
  # 【2つの倍率の違い】
  #   transfer-multiplier: バッファ→隣接ジャーへ1周期に出せる量に掛かる(Sourcelink#effectiveMaxPerTransfer)。
  #     速く運べるようになるだけで、素材1個から得られるソースは変わらない。
  #   yield-multiplier:    新しく生まれる量に掛かる(SourceGenerationScaling)。
  #     燃料/食料/素材の投入(手投入・ホッパー投入の両方)、バイタリックの受動生成、
  #     ボタニカルの成長ボーナスとバイタリックの撃破ボーナス ── この4経路すべてに掛かる。
  #     ⚠ 「注ぎ切れずにバッファへ戻す分」には掛からない。掛けると隣接ジャーが満杯の間だけ
  #        毎周期ソースが増える無限増殖になる(理由の全文は SourceGenerationScaling の javadoc)。
  #   どちらも未設定なら 1.0 = 無印と完全に同じ挙動。0以下/非有限値は警告のうえ 1.0 へ落とす。
  #
  # 【段の設計 2026-08-25 (W-257) 改定】<b>転送は 5 の階梯乗、生成は 2 の階梯乗</b>。
  #   転送: 無印 2 → 10 / 50 / 250 / 1250 / 6250 / 31250 / 156250 / 781250
  #   生成: 無印 2 → 4 / 8 / 16 / 32 / 64 / 128 / 256 / 512(2026-08-24 のまま据え置き)
  #   ⚠ <b>無印にも倍率が乗る</b>(両方 2.0)。「無印は倍率キーを持たない=1.0」を固定していた
  #     ShippedSourceLadderTest は 2026-08-24 に緩めてある。
  #
  #   ユーザー確定要件は「tier1 が 20tick ごとに 100 なら tier2 は 20tick ごとに 500」=
  #   <b>転送だけを1段 x5</b>。生成を同率にすると素材効率が段ごとに5倍になって
  #   資源が意味を失うので、生成側は x2 のまま分離した。
  #   結果として<b>階梯を上げるほど「詰まりにくくなる」</b>(排出が生成より速く伸びる)。
  #   これは 2026-08-24 の「釣り合いは全段で同じ」から意図的に外した点。
  #   不変条件は ShippedSourceLadderTest#transferOutgrowsYieldAtEveryRung が固定している。
  #
  #   ⚠ 最上段では int の上限に当たりうる。ソース機関(custom:source_engine = 3,000万)を
  #     スニークで1スタック(64個)焼べると 19.2億 x 512 ≒ 9,800億で、
  #     SourceGenerationScaling が int 上限(約21.4億)へ切り詰める(負値には化けない)。
  #     つまり最上段で機関を一括投入すると <b>投入分の大半は捨てられる</b>。
  #     高階梯では安い燃料を回す方が効率がよい、という逆転が起きる点に注意。
  #
  #   ⚠ 転送側の実効レート = transfer.sourcelink.max-per-transfer(250) x 倍率 ÷ interval-ticks(100)。
  #     無印(x2)で 5/tick = 100/20tick、次段(x10)で 25/tick = 500/20tick ── これが
  #     ユーザー要件の「tier1=100、tier2=500(20tickあたり)」。最上段(x781250)は
  #     195万/tick で、単体では int 上限に触れない(触れる場合は scaleCap が切り詰める)。
  #     インフィニティコアの範囲内ならさらに x2。基準値(max-per-transfer)を動かすと
  #     全段が線形に動くので、全体を調整したいときは倍率ではなくそちらを触る。
  #     ⚠ <b>drain-ratio(割合排出)は 0.0 に切ってある</b>。割合が残っていると
  #       「バッファが多いほど速い」= 階梯倍率が無意味になる領域が生まれ、
  #       ユーザー報告の「x2 が効いていない」「速度が一定じゃない」がそこで起きていた。
  #
  # 【2026-08-23 (W-189) に 4段 → 8段へ細分化】それまで触媒は
  #   欠片(_ii) / 結晶(_iii) / 凝縮物(_iv) / 機関(_v) と1段ずつしか無く、
  #   <b>次の段へ進む = 必ず次の触媒を解禁する</b>ことだった。とくに欠片で回している段階から
  #   結晶を要求されるまでが1段しかなく、そこが階梯の実質的な壁になっていた。
  #   触媒ごとに「同じ触媒で届く2段目」を1つずつ足して 8段にした:
  #     _ii(欠片x4) → _ii_b(欠片x8) → _iii(結晶x4) → _iii_b(結晶x8)
  #     → _iv(凝縮物x4) → _iv_b(凝縮物x8) → _v(機関x2) → _vi(機関x3+深淵の延べ棒)
  #   倍率: 転送 x10/x50/x250/x1250/x6250/x31250/x156250/x781250(無印は x2)。
  #         生成 x4/x8/x16/x32/x64/x128/x256/x512(無印は x2)。
  #   (2026-08-24 に両方とも2の階梯乗へ張り替え、2026-08-25 (W-257) に転送だけ5の階梯乗へ。
  #    さらに旧値は 転送 x2/x4/x6/x8/x12/x16/x24/x32 ・
  #    生成 x1.5/x2/x2.5/x3/x3.5/x4/x5/x6、無印は両方とも倍率なし=1.0 だった)。
  #   ⚠ <b>既存の段は誰も弱くしていない</b> ── 新段は上へ伸ばして空いた位置に入れてあり、
  #     _iii は x4.0/x2.0 → x6.0/x2.5 と<b>上がって</b>いる。既存プレイヤーの設置済み
  #     ソースリンクが弱体化しないのが、この足し方を選んだ理由。
  #     旧 _iii の性能(x4.0/x2.0)は「結晶を要らない新段」_ii_b が引き継いだ。
  #   ⚠ id は据え置き(設置済みブロックの PDC とレシピの core-item が切れるため)なので、
  #     挿し込んだ段の id は _ii_b のような枝番になっている。番号を詰め直さないこと。
  #
  # 【レシピの考え方】sourcejars.yml の上位ジャーと同じ「前段を炉に、階梯触媒を台座に」形。
  #   core-item は必ず前段の custom:<type>_sourcelink[_ii..] にして、既存レシピと
  #   (core-item, pedestal-items) の組が重複しないようにしている(重複すると後発が
  #   findFirst に負けて永久にクラフト不可になる ── common-traps.md 参照)。
  #   階梯触媒(source_shard/crystal/condenser/engine)は sourcejars.yml の上位ジャーと同じ物を使う
  #   (ソース階梯のはしごを一本化するため、ソースリンク専用の新触媒は作らない)。
  #
  # 【名前】数字表記(II/III)は 2026-08-03 に固有名へ置き換えた。id は据え置き
  #   ── id を変えるとレシピ(core-item: custom:..._ii)と設置済みブロックのPDCが全部切れる。
  #
  # 【見た目】custom-model-data は未設定 ── 割り当てるとリソースパック側(resourcepack/*、
  #   別レーンが編集中)に新規CMD登録が要るため、今回は据え置く。無印と同じモデルで表示される
  #   (display-name/lore と実際の block id で区別できるので機能面は問題ない)。見た目の分離は
  #   リソースパック側の残タスクとして報告する。
  # ===========================================================================
