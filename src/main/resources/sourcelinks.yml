# =============================================================================
# Sourcelink Material Values Configuration
# =============================================================================
# Each sourcelink type has a "materials" section mapping item ids to
# source point values. You can add, remove, or modify entries freely.
#
# Keys may be:
#   - Bukkit Material names (COAL, COOKED_BEEF, ...)
#   - custom:<arsItemId> or bare registered item ids (e.g. custom:source_gem)
#   - TrinityForge catalog ids (matched via catalog PDC)
#
# YAML tip: quote keys that contain ':'  →  "custom:source_gem": 10
# =============================================================================

# =============================================================================
# 転送速度・転送範囲 (2026-08-01 に定数から設定へ出した)
# =============================================================================
# ⚠ ここの既定値は「設定へ出す前のハードコード値と厳密に同じ」。
#    このブロックを丸ごと消しても挙動は変わらない(全て既定値へフォールバックする)。
# 変更は /ars reload で反映される(タイマー周期も張り直す)。
transfer:

  # --- ソースリンク → 隣接ソースジャーへの供給 ---
  sourcelink:
    # 供給処理を回す周期(tick)。20tick = 1秒。
    # ⚠ この周期はバイタリックの「常時生成(1周期あたり5)」の速さも決めるので、
    #    短くすると燃料なしの受動生成まで一緒に速くなる。
    # ⚠ バイタリックの受動生成分は、隣接ジャーが無い/満杯で注げなければ<捨てられる>。
    #    バッファへ戻るのは「焼べた分/討伐ボーナスとしてバッファから引いた分」だけ。
    #    こうしないと「ジャーを外して放置 → 後から上位ジャーを付けて一気に回収」で
    #    保管容量の制約が消える(既定でも1台あたり日86,400が無から積み上がっていた)。
    interval-ticks: 100

    # 1周期あたりにバッファから吐き出せる上限(ソースポイント)。
    # 実効レート = max-per-transfer ÷ interval-ticks。
    #   既定 50 / 100tick = 10/秒 = 864,000/日。
    #   つまりソース機関(custom:source_engine = 3,000万)を1個焼べても
    #   ジャーへ入り切るまで約35日かかり、レートを上げる唯一の手段が
    #   「ソースリンクの台数を増やすこと」になっていた(K-16)。
    # ⚠ 上げると回収時間が線形に短くなる。台数で殴る運用をやめさせたいなら
    #    ここを上げて、代わりに1台あたりの設置価値を上げる方が素直。
    #
    # ■ K-16 解消(2026-08-02): ここは「全種別共通の基準レート」。個別ソースリンクの
    #   items.<id>.transfer-multiplier がこの基準値に掛かるので、階梯を上げると
    #   【台数を増やさずに1台あたりのレートそのもの】が上がる(Sourcelink#effectiveMaxPerTransfer)。
    #   未設定は 1.0(挙動不変)。下の items.*_ii / *_iii がこのレバーの実例。
    #   容量(buffer-cap)は既に int上限=実質無制限なのでボトルネックはレート側だけ、という前提で
    #   buffer-cap 側には階梯倍率を掛けていない。
    # ■ 2026-08-25 (W-257): 50 → 250。ユーザー確定要件「割合ではなく階梯ごとに転送量を増やす。
    #   tier1 が 20tick ごとに 100 なら tier2 は 20tick ごとに 500」。
    #   最下段の階梯倍率が 2.0 なので、250 x 2.0 / 100tick = 500/100tick = 【100/20tick】。
    #   1段上げるごとに倍率が x5 になるので tier2 は 500/20tick。
    max-per-transfer: 250

    # バッファ(ソースリンク内部の未排出分)の上限。
    # ⚠ 以前は上限が無く int の加算だったため、約2.1億を超えると
    #    オーバーフローして負値になり、焼べた分が無言で全損していた。
    #    既定は int の上限 = 実質無制限だが、オーバーフローはしない。
    #    上限で切り捨てた分はサーバログに warning として残る。
    #    ⚠ 有限値にすると「上限に張り付いたまま毎周期切り捨てる」のが定常状態になるため、
    #      警告は同じブロックにつき1回だけ出す(上限を下回ると解除され、再到達時にまた1回)。
    buffer-cap: 2147483647

    # 1周期に「バッファの何割まで」出せるか(0.0〜1.0)。実際の排出量は
    #   max(max-per-transfer x 階梯倍率 x コア倍率, バッファ x drain-ratio)
    # の大きい方。0 にすると完全定額(=速度が一定)になる。
    #
    # ■ 2026-08-25 (W-257): 0.25 → 【0.0】。ユーザー指摘「転送速度が一定じゃないのが気持ち悪い」。
    #   割合排出には2つの弊害があった:
    #     (1) 速度が残量で変わるので、同じ設備でも見ていて速さが安定しない。
    #     (2) **階梯倍率を無意味にする**。定額と割合の大きい方を採るので、バッファが
    #         「定額x階梯倍率 ÷ 0.25」を超えると常に割合が勝つ。最下段(定額50x2=100)なら
    #         残量400以上で割合側が勝ち、そこから先は階梯を上げても排出量が1点も変わらない。
    #         高価値燃料を焼べると必ずこの領域に入るので、実質「階梯を上げても速くならない」
    #         状態だった(ユーザー報告「現状の x2 が効いていない可能性」の正体)。
    #   → 割合を切り、代わりに定額と階梯倍率(x5刻み)の側で速度を出す。
    # ⚠ 0 以外へ戻すときは、上の (2) を必ず読むこと。0.25 に戻すと階梯倍率が再び死ぬ。
    drain-ratio: 0.0

    # イベント検知半径(ブロック)。0 にするとその種別のイベント蓄積を止める。
    detection-radius:
      # バイタリック: この半径内で mob が死ぬとボーナスを蓄積する
      vitalic: 10
      # ボタニカル: この半径内で作物/樹木が成長すると蓄積する(アイテムloreの数字も追随する)
      botanical: 10

  # --- ドミニオンワンドで結んだソースリレー網 ---
  network:
    # 転送処理を回す周期(tick)。既定 40tick = 2秒。
    interval-ticks: 40
    # 1周期・1リンクあたりの転送量の「定額ぶん」。
    max-per-transfer: 100
    # 網の「割合ぶん」。0 で完全定額(=速度が一定)。
    #
    # ■ 2026-08-25 (W-257): 0.25 → 【0.0】。隣接供給と同じ理由(上の
    #   transfer.sourcelink.drain-ratio のコメント参照)。あわせて **網にも送信元の階梯倍率を
    #   掛けるようにした** ── それまで網には階梯倍率もコア倍率も一切掛からず、
    #   上位リンクにしても上位ジャーにしても毎秒2.5点(定額100 ÷ 40tick)で固定だった。
    #   1周期に送れる量 = max-per-transfer x 送信元の階梯倍率。
    #   送信元がソースリンクなら sourcelinks.yml の items.<id>.transfer-multiplier、
    #   ソースジャーなら sourcejars.yml の jars.<id>.transfer-multiplier を引く。
    #   最下段のジャー(source_jar)は 1.0 なので 100 / 40tick = 【50/20tick】が最低速度。
    drain-ratio: 0.0
    # 1本のリンクを張れる最大距離(ブロック)。ワールドを跨ぐ接続は距離に関係なく不可。
    # ⚠ ここを縮めても「既に張られている長いリンク」は消えない(新規接続だけが弾かれる)。
    max-link-range: 30

    # 経路のパーティクル可視化(2026-08-01 追加)。
    # ドミニオンワンドを持っている間だけ、その本人にだけ描画する。
    path-particles:
      # false で完全に無効化
      enabled: true
      #
      # ⚠ 負荷の見積り方(1プレイヤーあたりの粒子パケット数/秒):
      #     1経路の粒子数 = 経路の長さ ÷ spacing + 1(端点を両方描くため) + 2(終端マーカー)
      #     毎秒の粒子数 = 1経路の粒子数 × max-paths × (20 ÷ interval-ticks)
      #   ワンドは設置作業のあいだ持ちっぱなしになる道具なので、これは瞬間値ではなく定常負荷。
      #
      # 描画周期(tick)。
      # ⚠ DUST の寿命は約8〜40tick(クライアント側の乱数)。これより長い周期にすると
      #   描き直しの合間に半分近くが消えるので<点滅して見える>。
      #   2026-08-24: 20tick(=1秒)だとまさにその状態だったので 10tick へ戻した。
      interval-ticks: 10
      # 粒子の間隔(ブロック)。小さいほど線が濃くなる。
      # ⚠ 1経路あたりの粒子数は実装側でも128個にハードキャップされている(実個数)。
      #   間隔を詰めすぎると長い経路で上限に当たり、逆に間隔が広がる。
      spacing: 0.5
      # 粒の大きさ。1.0 がバニラのレッドストーン粒と同じで、線に使うと太すぎて
      # 「大きい玉の飛び石」になり線として読めない(2026-08-24 に設定へ出した)。
      # 終端マーカーと隣接供給の大きさもこの値からの相対値で決まる。
      dot-size: 0.45
      # プレイヤーからこの距離内に端点がある経路だけ描く(ブロック)
      # ⚠ 広いと周囲一帯が点だらけになり「今どれを繋いだのか」が埋もれる。
      view-distance: 24
      # 1回の描画で扱う経路数の上限(1プレイヤーあたり)
      #
      # ■ 負荷の推移(1プレイヤーあたりの粒子/秒。30m経路として)
      #   初版          0.5 / 10tick / 64経路 / 48m → 63 x 64 x 2 = 約8,064
      #   2026-08-01    1.0 / 20tick / 16経路 / 48m → 33 x 16 x 1 = 約528
      #   2026-08-24    0.5 / 10tick /  8経路 / 24m → 63 x  8 x 2 = 約1,008
      #   密度を2倍にした代わりに範囲と本数を半分にしたので、初版の1/8で収まっている。
      max-paths: 8

  # --- infinity_source_core を「置いて機能させる」(2026-08-02 追加。柱6) ---
  # 「1億ソース到達」の証明アイテムを設置すると、周囲のソースリンクに補正が乗る恒久設備になる。
  # マルチブロックのパターン判定はしない(半径判定だけで成立させる)。設置しても消費されず、
  # 右クリックで回収して別の場所へ置き直せる(使い回し可)。
  infinity-core:
    # 設置された infinity_source_core からこの半径内のソースリンクに補正が乗る(ブロック単位)。
    # 0 にするとこの補正自体を無効化できる。
    radius: 5
    # 半径内のソースリンクの sourcelink.max-per-transfer に掛かる倍率(転送量が増える)。
    transfer-multiplier: 2.0
    # 半径内のソースリンクの sourcelink.buffer-cap に掛かる倍率(バッファ上限が増える)。
    # ⚠ 倍率適用後の値も buffer-cap と同じオーバーフロー安全なクランプ(Sourcelink#addToBuffer)を
    #   必ず通す。素通しにすると焼べた分が無言で全損する(K-16 の再発)。
    buffer-multiplier: 2.0

